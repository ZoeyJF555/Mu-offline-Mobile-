name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - android-native
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/Mu-Offline-Mobile.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mu-Offline-Mobile-APK
          path: apk/Mu-Offline-Mobile.apk

      - name: Publish APK to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Mu Offline Mobile (Último APK)"
          body: "APK compilado automáticamente desde el código fuente de Android (Kotlin + Jetpack Compose)."
          files: apk/Mu-Offline-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit APK directly into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/Mu-Offline-Mobile.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Mu-Offline-Mobile.apk [skip ci]"
            git push
          fi
